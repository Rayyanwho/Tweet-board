{% extends "layout.html" %}

{% block title %}
Rayyan aur tweet
{% endblock %}

{% block content %}
    <h1>Rayyan's Tweet</h1>
  

<style>
    /* Page */
body{
    background: #e0e5ec;
    font-family: "Poppins", sans-serif;
}

/* Center the form */
.neumorphic-container{
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Form Card */
.form{
    width: 450px;
    padding: 35px;
    border-radius: 25px;
    background: #e0e5ec;
    box-shadow:
        12px 12px 24px #b8bec7,
        -12px -12px 24px #ffffff;
}

/* Labels */
.form label{
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #555;
}

/* Inputs */
.form input,
.form textarea,
.form select{
    width: 100%;
    padding: 14px 16px;
    margin-bottom: 20px;
    border: none;
    border-radius: 15px;
    background: #e0e5ec;
    outline: none;
    font-size: 15px;
    box-shadow:
        inset 6px 6px 12px #b8bec7,
        inset -6px -6px 12px #ffffff;
    transition: .3s ease;
}

/* Focus */
.form input:focus,
.form textarea:focus,
.form select:focus{
    box-shadow:
        inset 3px 3px 6px #b8bec7,
        inset -3px -3px 6px #ffffff;
}

/* Textarea */
.form textarea{
    min-height: 130px;
    resize: vertical;
}

/* File input */
.form input[type="file"]{
    padding: 12px;
    cursor: pointer;
}

/* Button */
.neo-btn{
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 15px;
    background: #e0e5ec;
    color: #444;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: .25s ease;
    box-shadow:
        8px 8px 16px #b8bec7,
        -8px -8px 16px #ffffff;
}

/* Hover */
.neo-btn:hover{
    box-shadow:
        4px 4px 8px #b8bec7,
        -4px -4px 8px #ffffff;
    transform: translateY(-2px);
}

/* Click */
.neo-btn:active{
    box-shadow:
        inset 6px 6px 12px #b8bec7,
        inset -6px -6px 12px #ffffff;
    transform: scale(.98);
}
</style>
<h2>
{% if form.instance.pk %}
Edit Tweet
{% else %}
Create Tweet
{% endif %}
</h2>
<form method="post" enctype='multipart/form-data'class= 'form'> 
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save Tweet</button>
</form>
{% endblock %}
